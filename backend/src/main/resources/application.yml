server:
  port: 8081

spring:
  profiles:
    active: dev

  # ========== 数据源配置 ==========
  datasource:
    # 开发环境使用 H2 内存数据库，无需额外安装
    url: jdbc:h2:mem:mdonline;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Web Console（开发调试用，访问 http://localhost:8080/h2-console）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 启动时自动执行 SQL 建表
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data-h2.sql

# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# ========== SpringDoc OpenAPI 配置 ==========
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

# ========== 日志 ==========
logging:
  level:
    com.mdonline: debug
